work2:{time:"05:40 PM",art:"✅",color:"#e4f2e6",title:"งานเสร็จแล้วจริง ๆ",text:"คุณปิดไฟล์ได้ก่อนค่ำ เป็นความรู้สึกที่ดีมากจนอยากส่งข้อความบอกทุกคน แต่ทุกคนก็มีงานของตัวเอง",choices:[["เก็บโต๊ะแล้วกลับ","evening",{mins:5,focused:1}],["แวะซื้อขนมฉลอง","evening",{mins:12,snack:1}],["นั่งดู Reels เป็นรางวัล","evening",{mins:16,phone:1}]]},

night:{time:"10:15 PM",art:"🌙",color:"#ddf2f6",title:"วันนี้จบแล้ว…จริงไหม?",text:"คุณกลับถึงห้องแล้ว เหลือภารกิจสุดท้ายคือเก็บของ ตั้งนาฬิกาปลุก และห้ามเผลอเปิด Reels ที่เพื่อนส่งมา 37 คลิป ดูท่าเพื่อนจะเหงามาก",choices:[["เก็บของ ตั้งปลุก แล้วนอน","end",{mins:12,sleep:1}],["เปิดดู Reels ให้ครบ จะได้ตอบเพื่อน","end",{mins:48,phone:2}],["พรุ่งนี้ค่อยคิด วันนี้เก่งมากแล้ว","end",{mins:4,sleep:1,odd:1}]]},};
let state={mins:0,excuse:0,phone:0,hair:0,wrong:0,correct:0,odd:0,coffee:0},history=[];
const game=document.querySelector("#game"),result=document.querySelector("#result"),clock=document.querySelector("#clock");
function reset(){state={mins:0,excuse:0,phone:0,hair:0,wrong:0,correct:0,odd:0,coffee:0};history=[];result.style.display="none";game.style.display="block";render("start")}
function render(id){if(id==="end")return finish();const s=scenes[id];clock.textContent=s.time;game.style.setProperty("--art",s.color);game.innerHTML='<div class="tag">DAY LOG / '+String(history.length+1).padStart(2,"0")+'</div><div class="progress"><i style="width:'+Math.min((history.length+1)*8,92)+'%"></i></div><span class="time">'+s.time+'</span><h2>'+s.title+'</h2><p>'+s.text+'</p><div class="art"><span class="emoji">'+s.art+'</span></div><div class="small">เลือกให้ดี ทุกการตัดสินใจจะส่งผลต่อเรื่องราวของคุณ</div><div class="options">'+s.choices.map((c,i)=>'<button class="choice" data-next="'+c[1]+'" data-change="'+encodeURIComponent(JSON.stringify(c[2]))+'"><b>'+(i+1)+'</b><span>'+c[0]+'</span></button>').join("")+'</div>';game.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{Object.assign(state,add(state,JSON.parse(decodeURIComponent(b.dataset.change))));history.push(b.textContent.trim());render(b.dataset.next)})}
function add(old,plus){const next={...old};for(const k in plus)next[k]=(next[k]||0)+plus[k];return next}
function finish(){let actual=state.mins+16;if(state.train)actual-=3;if(state.snack)actual+=7;if(state.ride)actual+=10;if(state.wrong)actual+=28;if(state.correct)actual-=2;let ending,color,copy,emoji;if(state.wrong){ending="ไปผิดที่ แต่ยังตรงเวลา";color="#fff0c7";copy="คุณชนะเวลาแต่แพ้แผนที่ ตอนนี้เลยมายืนอยู่หน้าร้านที่ไม่มีใครรู้จักอย่างสง่างาม";emoji="🗺️"}else if(state.phone>=2){ending="นอนดึกเพราะคลิปของเพื่อน";color="#e9e1f4";copy="คุณตอบครบทุกคลิปแล้ว แต่เพื่อนยังส่งมาเพิ่มอีก 12 คลิป ดูท่าเรื่องนี้จะยังไม่จบง่าย ๆ";emoji="📱"}else if(state.rain&&state.odd){ending="เปียกนิดหน่อย แต่ได้เรื่องไปเล่า";color="#ddf2f6";copy="คุณฝ่าฝนไปกินข้าว แม้เสื้อจะเปียกไปหนึ่งตัว แต่ก็ได้เรื่องสนุกไว้เล่าต่ออีกนาน";emoji="🌧️"}else if(state.sleep&&state.focused){ending="จบวันแบบจัดการทุกอย่างได้";color="#e4f2e6";copy="คุณตั้งนาฬิกาปลุก เก็บของ และทำตามที่รับปากไว้ได้ครบ วันนี้อาจไม่สมบูรณ์แบบ แต่คุณจัดการได้ดี";emoji="🌙"}else if(state.helpful>=3){ending="ฮีโร่ประจำวันโดยไม่รู้ตัว";color="#fbe2e7";copy="คุณช่วยคนอื่นหลายครั้งจนเกือบลืมดูแลตัวเอง แต่ทุกคนก็จำได้ว่าคุณอยู่ข้าง ๆ ในเวลาที่ต้องการ";emoji="🦸"}else if(state.excuse>=3){ending="วันนี้มีข้ออ้างเต็มไปหมด";color="#fbe8d9";copy="ทุกเรื่องมีเหตุผลของมัน แต่พอแก้เรื่องหนึ่งได้ ก็มักมีอีกเรื่องตามมา";emoji="🫠"}else if(state.snack>=2){ending="จำภารกิจไม่ได้ แต่จำของกินได้แม่น";color="#fff0c7";copy="คุณอาจจำไม่ได้ว่าวันนี้ไปไหนมาบ้าง แต่จำรสชาติขนมได้แม่น";emoji="🍪"}else{ending="วันธรรมดาที่วุ่นวายพอดี ๆ";color="#ddf2f6";copy="วันนี้อาจไม่เป็นไปตามแผนทุกอย่าง แต่คุณก็กลับถึงบ้านพร้อมเรื่องเล่ามากมาย";emoji="🌤️"}clock.textContent="GOOD NIGHT";game.style.display="none";result.style.display="block";result.innerHTML='<div class="receipt" style="--result:'+color+'"><div class="tag">ON MY WAY. / DAILY RECEIPT</div><div class="art" style="--art:'+color+'"><span class="emoji">'+emoji+'</span></div><h2>'+ending+'</h2><p>'+copy+'</p><div class="metrics"><div class="metric"><strong>'+actual+'</strong><span>MIN IN MOTION</span></div><div class="metric"><strong>'+state.excuse+'</strong><span>EXCUSES</span></div><div class="metric"><strong>'+history.length+'</strong><span>CHOICES</span></div></div><p class="small">“'+(state.phone?"เพื่อนน่าจะเหงา เลยส่ง Reels มาเยอะ":"วันนี้คุณผ่านมันมาได้แบบของคุณเอง")+'”</p></div><button class="share" id="share">SHARE TO STORY ↗</button><button class="again" id="again">PLAY ANOTHER DAY</button>';document.querySelector("#again").onclick=reset;document.querySelector("#share").onclick=share}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=String(text).split("");let line="";for(const word of words){const test=line+word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight}else line=test}if(line)ctx.fillText(line,x,y);return y+lineHeight}
function makeStoryImage(){const canvas=document.createElement("canvas");canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext("2d");const title=result.querySelector("h2").textContent;const copy=result.querySelector(".receipt p").textContent;const metrics=[...result.querySelectorAll(".metric")].map(el=>[el.querySelector("strong").textContent,el.querySelector("span").textContent]);const palette=["#FBE2E7","#DDF2F6","#FFF0C7","#E4F2E6"];ctx.fillStyle="#F3E8D6";ctx.fillRect(0,0,1080,1920);const bg=ctx.createRadialGradient(120,170,20,700,950,1100);bg.addColorStop(0,"rgba(242,154,167,.28)");bg.addColorStop(1,"rgba(243,232,214,0)");ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);ctx.fillStyle="#9DD9E8";ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(930,220,170,0,Math.PI*2);ctx.fill();ctx.fillStyle="#A9D9B5";ctx.beginPath();ctx.arc(130,1710,140,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#4A3930";ctx.font="700 34px 'IBM Plex Mono',monospace";ctx.fillText("ON MY WAY.",86,110);ctx.fillStyle="#806D5F";ctx.font="500 22px 'IBM Plex Mono',monospace";ctx.fillText("DAILY STORY RECEIPT",86,148);ctx.fillStyle="#FFF8EA";roundRect(ctx,70,260,940,1280,42);ctx.fill();ctx.strokeStyle="#D8C8B3";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="#F29AA7";roundRect(ctx,70,260,940,18,9);ctx.fill();ctx.fillStyle="#927F70";ctx.font="600 22px 'IBM Plex Mono',monospace";ctx.fillText("TODAY, YOU WERE...",120,370);ctx.fillStyle="#4A3930";ctx.font="800 68px Prompt,sans-serif";let y=480;y=wrapText(ctx,title,120,y,820,82);ctx.fillStyle="#705C4E";ctx.font="400 31px Prompt,sans-serif";y=wrapText(ctx,copy,120,y+45,820,52);ctx.fillStyle="#E9DDCD";roundRect(ctx,120,y+42,820,2,1);ctx.fill();const boxY=y+105;const boxW=245;metrics.forEach((m,i)=>{const x=120+i*(boxW+18);ctx.fillStyle=palette[i%palette.length];roundRect(ctx,x,boxY,boxW,170,20);ctx.fill();ctx.fillStyle="#4A3930";ctx.font="700 48px 'IBM Plex Mono',monospace";ctx.fillText(m[0],x+22,boxY+73);ctx.fillStyle="#806D5F";ctx.font="500 17px 'IBM Plex Mono',monospace";wrapText(ctx,m[1],x+22,boxY+112,boxW-40,25)});ctx.fillStyle="#4A3930";ctx.font="700 31px Prompt,sans-serif";ctx.fillText("วันนี้คุณเลือกเส้นทางของตัวเอง",120,boxY+290);ctx.fillStyle="#806D5F";ctx.font="400 25px Prompt,sans-serif";wrapText(ctx,"ทุกทางเลือกมีเรื่องราว และบางครั้งความวุ่นวายก็เป็นส่วนหนึ่งของวันที่ดี",120,boxY+345,820,40);ctx.fillStyle="#4A3930";ctx.font="700 28px 'IBM Plex Mono',monospace";ctx.fillText("กลับไปเล่นต่อได้ที่ ON MY WAY.",120,1760);ctx.fillStyle="#927F70";ctx.font="500 20px 'IBM Plex Mono',monospace";ctx.fillText("GROW UP AND SHOW UP",120,1805);return canvas}
function canvasBlob(canvas){return new Promise(resolve=>canvas.toBlob(resolve,"image/png"))}
async function share(){const title=result.querySelector("h2").textContent;const text="ON MY WAY. วันนี้ฉัน: "+title+" ✦";try{const blob=await canvasBlob(makeStoryImage());const file=new File([blob],"on-my-way-story.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:"ON MY WAY.",text,files:[file]})}else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="on-my-way-story.png";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("บันทึกภาพ Story แล้ว ✦")}}catch(e){if(e.name!=="AbortError")toast("สร้างภาพไม่สำเร็จ ลองอีกครั้งนะ")}}
function toast(message="คัดลอกผลลัพธ์แล้ว ✦"){const t=document.querySelector("#toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function toast(){const t=document.querySelector("#toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
reset();
</script>
