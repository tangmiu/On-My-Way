dding:12px 17px;border-radius:999px;background:var(--ink);color:var(--cream);font:500 11px "IBM Plex Mono",monospace;transition:.25s;z-index:4}.toast.show{transform:translate(-50%,0)}.spark{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--pink);animation:float 5s ease-in-out infinite}.spark:nth-child(2){background:var(--blue);right:8%;top:20%;animation-delay:-2s}.spark:nth-child(3){background:var(--yellow);left:3%;top:55%;animation-delay:-4s}.spark:nth-child(4){background:var(--green);right:11%;bottom:10%;animation-delay:-1s}@keyframes arrive{from{opacity:0;transform:translateY(14px) rotate(.4deg)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}@keyframes float{50%{transform:translateY(-18px) rotate(12deg)}}@media(max-width:500px){.shell{width:min(100% - 24px,720px)}.card{padding:23px 19px}.stage{min-height:570px}.art{height:155px}.emoji{font-size:82px}.metrics{gap:6px}.metric{padding:10px 7px}.metric strong{font-size:20px}}

,

let state={mins:0,excuse:0,phone:0,hair:0,wrong:0,correct:0,odd:0,coffee:0},history=[];
const game=document.querySelector("#game"),result=document.querySelector("#result"),clock=document.querySelector("#clock");
function reset(){state={mins:0,excuse:0,phone:0,hair:0,wrong:0,correct:0,odd:0,coffee:0};history=[];result.style.display="none";game.style.display="block";render("start")}
function render(id){if(id==="end")return finish();const s=scenes[id];clock.textContent=s.time;game.style.setProperty("--art",s.color);game.innerHTML='<div class="tag">MINI STORY / '+String(history.length+1).padStart(2,"0")+' OF 05</div><div class="progress"><i style="width:'+Math.min(history.length*20,90)+'%"></i></div><span class="time">'+s.time+'</span><h2>'+s.title+'</h2><p>'+s.text+'</p><div class="art"><span class="emoji">'+s.art+'</span></div><div class="small">เลือกดี ๆ นะ ทุกอย่างถูกบันทึกโดยจักรวาล</div><div class="options">'+s.choices.map((c,i)=>'<button class="choice" data-next="'+c[1]+'" data-change="'+encodeURIComponent(JSON.stringify(c[2]))+'"><b>'+(i+1)+'</b><span>'+c[0]+'</span></button>').join("")+'</div>';game.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{Object.assign(state,add(state,JSON.parse(decodeURIComponent(b.dataset.change))));history.push(b.textContent.trim());render(b.dataset.next)})}
function add(old,plus){const next={...old};for(const k in plus)next[k]=(next[k]||0)+plus[k];return next}
function finish(){let actual=state.mins+16;if(state.train)actual-=3;if(state.snack)actual+=7;if(state.ride)actual+=10;if(state.wrong)actual+=28;if(state.correct)actual-=2;let ending,color,copy,emoji;if(state.sleep&&state.phone<2&&state.helpful){ending="จบวันแบบผู้ใหญ่ที่พยายามแล้ว";color="#e4f2e6";copy="คุณไม่ได้ควบคุมทุกอย่างได้ แต่วันนี้คุณพยายามดูแลทั้งเวลาและคนรอบตัวแล้ว";emoji="🌙"}else if(state.phone>=2){ending="นอนดึกเพราะ Reels ของเพื่อนที่น่าจะเหงามาก";color="#e9e1f4";copy="วันพรุ่งนี้ยังไม่เริ่ม แต่เพื่อนส่ง Reels ใหม่มาแล้วอีก 12 อัน";emoji="📱"}else if(state.odd>=2){ending="วุ่นวาย แต่เป็นวันที่มีเรื่องเล่า";color="#fbe8d9";copy="บางวันไม่ได้มีชัยชนะใหญ่ ๆ แค่ผ่านไปได้พร้อมเรื่องตลกก็ถือว่าเก่งแล้ว";emoji="🎈"}else if(state.wrong){ending="ไปผิดที่ แต่ตรงเวลา";color="#fff0c7";copy="คุณชนะเวลา แพ้แผนที่ และยังยืนอยู่หน้าร้านที่ไม่มีใครรู้จักอย่างสง่างาม";emoji="🗺️"}else if(actual<=29){ending="ถึงก่อนทุกคน";color="#e4f2e6";copy="วันนี้คุณไม่ใช่คนกำลังไป คุณคือคนที่คนอื่นกำลังรอ";emoji="🏆"}else if(actual<=38){ending="ทันแบบปาฏิหาริย์";color="#ddf2f6";copy="คุณไม่มีแผน แต่โชคมีแผนให้คุณ และมันมาในรูปแบบรถไฟฟ้าขบวนพอดี";emoji="✨"}else if(state.excuse>=3){ending="สายแบบมีหลักฐานเยอะมาก";color="#fbe2e7";copy="จักรวาลอาจมีส่วน แต่ประวัติการตัดสินใจของคุณก็พูดดังพอสมควร";emoji="🫠"}else{ending="สาย แต่ยังน่ารักอยู่";color="#fbe8d9";copy="คุณมาถึงพร้อมเรื่องเล่ามากมาย และเพื่อนก็ไม่รู้จะโกรธตรงไหนก่อน";emoji="🌤️"}clock.textContent="GOOD NIGHT";game.style.display="none";result.style.display="block";result.innerHTML='<div class="receipt" style="--result:'+color+'"><div class="tag">ON MY WAY. / DAILY RECEIPT</div><div class="art" style="--art:'+color+'"><span class="emoji">'+emoji+'</span></div><h2>'+ending+'</h2><p>'+copy+'</p><div class="metrics"><div class="metric"><strong>'+actual+'</strong><span>MIN TO ARRIVE</span></div><div class="metric"><strong>'+state.excuse+'</strong><span>EXCUSES</span></div><div class="metric"><strong>'+history.length+'</strong><span>CHOICES</span></div></div><p class="small">“'+(state.phone?"Reels ของเพื่อนน่าจะมีเยอะ เพราะเพื่อนคงเหงา":"วันนี้คุณเชื่อในตัวเองมากกว่านาฬิกา")+'”</p></div><button class="share" id="share">SHARE TO STORY ↗</button><button class="again" id="again">PLAY ANOTHER DAY</button>';document.querySelector("#again").onclick=reset;document.querySelector("#share").onclick=share}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=String(text).split("");let line="";for(const word of words){const test=line+word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight}else line=test}if(line)ctx.fillText(line,x,y);return y+lineHeight}
function makeStoryImage(){const canvas=document.createElement("canvas");canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext("2d");const title=result.querySelector("h2").textContent;const copy=result.querySelector(".receipt p").textContent;const metrics=[...result.querySelectorAll(".metric")].map(el=>[el.querySelector("strong").textContent,el.querySelector("span").textContent]);const palette=["#FBE2E7","#DDF2F6","#FFF0C7","#E4F2E6"];ctx.fillStyle="#F3E8D6";ctx.fillRect(0,0,1080,1920);const bg=ctx.createRadialGradient(120,170,20,700,950,1100);bg.addColorStop(0,"rgba(242,154,167,.28)");bg.addColorStop(1,"rgba(243,232,214,0)");ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);ctx.fillStyle="#9DD9E8";ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(930,220,170,0,Math.PI*2);ctx.fill();ctx.fillStyle="#A9D9B5";ctx.beginPath();ctx.arc(130,1710,140,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#4A3930";ctx.font="700 34px 'IBM Plex Mono',monospace";ctx.fillText("ON MY WAY.",86,110);ctx.fillStyle="#806D5F";ctx.font="500 22px 'IBM Plex Mono',monospace";ctx.fillText("DAILY STORY RECEIPT",86,148);ctx.fillStyle="#FFF8EA";roundRect(ctx,70,260,940,1280,42);ctx.fill();ctx.strokeStyle="#D8C8B3";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="#F29AA7";roundRect(ctx,70,260,940,18,9);ctx.fill();ctx.fillStyle="#927F70";ctx.font="600 22px 'IBM Plex Mono',monospace";ctx.fillText("TODAY, YOU WERE...",120,370);ctx.fillStyle="#4A3930";ctx.font="800 68px Prompt,sans-serif";let y=480;y=wrapText(ctx,title,120,y,820,82);ctx.fillStyle="#705C4E";ctx.font="400 31px Prompt,sans-serif";y=wrapText(ctx,copy,120,y+45,820,52);ctx.fillStyle="#E9DDCD";roundRect(ctx,120,y+42,820,2,1);ctx.fill();const boxY=y+105;const boxW=245;metrics.forEach((m,i)=>{const x=120+i*(boxW+18);ctx.fillStyle=palette[i%palette.length];roundRect(ctx,x,boxY,boxW,170,20);ctx.fill();ctx.fillStyle="#4A3930";ctx.font="700 48px 'IBM Plex Mono',monospace";ctx.fillText(m[0],x+22,boxY+73);ctx.fillStyle="#806D5F";ctx.font="500 17px 'IBM Plex Mono',monospace";wrapText(ctx,m[1],x+22,boxY+112,boxW-40,25)});ctx.fillStyle="#4A3930";ctx.font="700 31px Prompt,sans-serif";ctx.fillText("วันนี้คุณเลือกทางของตัวเอง",120,boxY+290);ctx.fillStyle="#806D5F";ctx.font="400 25px Prompt,sans-serif";wrapText(ctx,"ทุกทางเลือกมีเรื่องเล่า และบางทีความวุ่นวายก็เป็นส่วนหนึ่งของวันดี ๆ",120,boxY+345,820,40);ctx.fillStyle="#4A3930";ctx.font="700 28px 'IBM Plex Mono',monospace";ctx.fillText("เล่นต่อได้ที่ ON MY WAY.",120,1760);ctx.fillStyle="#927F70";ctx.font="500 20px 'IBM Plex Mono',monospace";ctx.fillText("GROW UP AND SHOW UP",120,1805);return canvas}
function canvasBlob(canvas){return new Promise(resolve=>canvas.toBlob(resolve,"image/png"))}
async function share(){const title=result.querySelector("h2").textContent;const text="ON MY WAY. วันนี้ฉัน: "+title+" ✦";try{const blob=await canvasBlob(makeStoryImage());const file=new File([blob],"on-my-way-story.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:"ON MY WAY.",text,files:[file]})}else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="on-my-way-story.png";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("บันทึกภาพ Story แล้ว ✦")}}catch(e){if(e.name!=="AbortError")toast("สร้างภาพไม่สำเร็จ ลองอีกครั้งนะ")}}
function toast(message="คัดลอกผลลัพธ์แล้ว ✦"){const t=document.querySelector("#toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function toast(){const t=document.querySelector("#toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
reset();
</script>
